<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
<style>
  .run{animation:run 3.5s linear infinite}
  @keyframes run{0%{transform:translateX(-300px)}100%{transform:translateX(1200px)}}
  .p{animation:p 2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
</style>
<defs>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".2" stop-color="#00f0ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset=".8" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
  <linearGradient id="h" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="c"><rect y="10" width="1200" height="4"/></clipPath>
</defs>
<rect y="11" width="1200" height="2" fill="url(#l)" filter="url(#g)" class="p"/>
<g clip-path="url(#c)"><rect y="10" width="300" height="4" fill="url(#h)" class="run"/></g>
<g fill="#ff2bd6" filter="url(#g)"><rect x="596" y="8" width="8" height="8" transform="rotate(45 600 12)"/></g>
</svg>
