<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-label="Proyecto PescaControl">
<style>
  .bd{stroke-dasharray:260 1172;animation:run 5s linear infinite}
  @keyframes run{to{stroke-dashoffset:-1432}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .sweep{animation:sweep 4.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(580px)}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#110628"/><stop offset="1" stop-color="#05010d"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="cl"><rect x="1" y="1" width="478" height="234" rx="16"/></clipPath>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00f0ff" stroke-opacity=".06"/></pattern>
</defs>
<rect x="1" y="1" width="478" height="234" rx="16" fill="url(#bg)"/>
<rect x="1" y="1" width="478" height="234" rx="16" fill="url(#grid)"/>
<g clip-path="url(#cl)"><rect x="0" y="0" width="160" height="236" fill="url(#sh)" transform="skewX(-20)" class="sweep"/></g>
<rect x="1" y="1" width="478" height="234" rx="16" fill="none" stroke="url(#edge)" stroke-opacity=".3" stroke-width="1.5"/>
<rect x="1" y="1" width="478" height="234" rx="16" fill="none" stroke="url(#edge)" stroke-width="2.5" class="bd" filter="url(#g)"/>
<text x="24" y="38" fill="#00f0ff" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5" letter-spacing="3">◢ PROYECTO 01</text>
<g font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5" text-anchor="end">
  <circle cx="368" cy="33.5" r="5" fill="#3178c6" class="pulse"/>
  <text x="456" y="38" fill="#c9c9e3">TypeScript</text>
</g>
<text x="24" y="80" fill="#ffffff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="800" filter="url(#g)">PescaControl</text>
<rect x="24" y="92" width="44" height="3" rx="1.5" fill="url(#edge)"/>
<text x="24" y="120" fill="#b4b4cf" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5">Sistema de gestión de operaciones pesqueras</text><text x="24" y="143" fill="#b4b4cf" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15.5">y control de desembarques.</text>
<g><rect x="24" y="182" width="60" height="28" rx="14" fill="#00f0ff" fill-opacity=".1" stroke="#00f0ff" stroke-opacity=".7"/><text x="54.0" y="200.5" text-anchor="middle" fill="#e9e9ff" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5">React</text></g><g><rect x="92.0" y="182" width="52" height="28" rx="14" fill="#00f0ff" fill-opacity=".1" stroke="#00f0ff" stroke-opacity=".7"/><text x="118.2" y="200.5" text-anchor="middle" fill="#e9e9ff" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5">Vite</text></g><g><rect x="152.4" y="182" width="90" height="28" rx="14" fill="#00f0ff" fill-opacity=".1" stroke="#00f0ff" stroke-opacity=".7"/><text x="197.6" y="200.5" text-anchor="middle" fill="#e9e9ff" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5">Bootstrap</text></g><g><rect x="250.8" y="182" width="106" height="28" rx="14" fill="#00f0ff" fill-opacity=".1" stroke="#00f0ff" stroke-opacity=".7"/><text x="303.6" y="200.5" text-anchor="middle" fill="#e9e9ff" font-family="'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12.5">json-server</text></g>
<path d="M446 222 h20 v-20" stroke="#8b5cf6" stroke-width="2" fill="none" opacity=".8"/>
</svg>
