<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Kevin - Estudiante de Ingeniería de Sistemas">
<style>
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .title{animation:flicker 7s infinite}
  @keyframes flicker{0%,18%,20.5%,23%,62%,64.5%,100%{opacity:1}19%,22%,63%{opacity:.35}}
  .gl{opacity:0}
  .gc{animation:gc 5s infinite steps(1)}
  .gm{animation:gm 5s infinite steps(1)}
  @keyframes gc{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.85;transform:translate(-7px,2px)}89%{opacity:.85;transform:translate(4px,-1px)}91%{opacity:0}}
  @keyframes gm{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.85;transform:translate(6px,-2px)}89%{opacity:.85;transform:translate(-5px,1px)}91%{opacity:0}}
  .blink{animation:blink 1.4s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
  .sun{animation:sun 6s ease-in-out infinite}
  @keyframes sun{0%,100%{opacity:.9}50%{opacity:1}}
  .scan{animation:scan 6s linear infinite}
  @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(360px)}}
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03000a"/><stop offset=".55" stop-color="#14032b"/><stop offset="1" stop-color="#3a0b4f"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0433"/><stop offset="1" stop-color="#030008"/>
  </linearGradient>
  <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe14d"/><stop offset=".5" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff2bd6"/>
  </linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#b9fbff"/><stop offset=".5" stop-color="#00f0ff"/><stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="sunMask"><rect width="1200" height="360" fill="#fff"/><rect x="0" y="175" width="1200" height="3" fill="#000"/><rect x="0" y="192" width="1200" height="5" fill="#000"/><rect x="0" y="208" width="1200" height="7" fill="#000"/><rect x="0" y="222" width="1200" height="9" fill="#000"/><rect x="0" y="235" width="1200" height="11" fill="#000"/></mask>
  <clipPath id="skyClip"><rect width="1200" height="245"/></clipPath>
  <clipPath id="groundClip"><rect y="245" width="1200" height="115"/></clipPath>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="line" x="-5%" y="-50%" width="110%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#000" opacity=".28"/></pattern>
</defs>

